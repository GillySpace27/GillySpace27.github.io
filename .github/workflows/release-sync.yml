# Release sync (WS-22): the backstop that keeps the software pages in step with HelioFITS Studio
# releases. Every 6 hours, on demand, or on a repository_dispatch "studio-release" from the Studio
# repo (not wired yet: it needs a token stored there), it reads the newest Studio release (GET only)
# and, when the feed or the download page's fallback pin is behind, makes the same change the
# runbook does (SITE.md, "After a suite release"), runs the site checks and opens a pull request.
# It never merges: merging publishes gilly.space and stays Gilly's click. Platforms are confirmed
# only where the download page's PLATFORMS already says confirmed: true (feed_studio_release.py
# --confirm-from-page). A pull request opened with GITHUB_TOKEN does not start check.yml, so the
# same checks run here first. Opening one needs Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests". Peek has no backstop: its record waits for App
# Store Connect's READY_FOR_SALE, which only the ship-heliofits skill can read.
name: release-sync

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [studio-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bring the feed and the fallback pin up to the newest release
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api 'repos/GillySpace27/HelioFITS-Studio/releases?per_page=1' --jq '.[0].tag_name')
          ver="${tag#v}"
          echo "newest Studio release: $tag"
          appended=no
          if ! python3 tools/feed_studio_release.py --check; then
            python3 tools/feed_studio_release.py "$ver" --confirm-from-page
            appended=yes
          fi
          if ! python3 tools/pin_studio_fallback.py --from-github; then
            if [ "$appended" = yes ]; then
              echo "::notice::$tag is not fully packaged yet (package.yml attaches Windows and Linux); the next run tries again"
              git checkout -- .
              exit 0
            fi
            echo "::notice::the pin cannot move yet; nothing to do"
            exit 0
          fi
          if git diff --quiet; then
            echo "UP TO DATE: the feed and the pin already name $ver"
            exit 0
          fi
          python3 heliosoftware/feed/build_feed.py
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Site checks (check.yml does not run on a pull request opened by GITHUB_TOKEN)
        if: steps.sync.outputs.version != ''
        run: |
          python3 tools/check_site.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Open the pull request
        if: steps.sync.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.sync.outputs.version }}
        run: |
          branch="release/heliofits-studio-$VER"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch is already on origin; its pull request is the one to merge"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Feed: HelioFITS Studio $VER" -m "Written by .github/workflows/release-sync.yml from the GitHub release."
          git push -u origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Feed: HelioFITS Studio $VER" \
            --body "HelioFITS Studio $VER: feed record, What's new and the download page's fallback pin, written by release-sync.yml. check_site.py and the unit tests passed in the workflow run. Platforms marked confirmed follow the page's PLATFORMS flags; flip any others by hand. Merging publishes gilly.space."
