<script>
  // The three closest pages to the address asked for (WS-19), scored by the palette's own
  // fuzzyScore over the same entries. Skipped while the lowercase redirect above is leaving.
  (function () {
    var G = window.GillySite, path = location.pathname;
    if (!G || path !== path.toLowerCase()) return;
    var q = decodeURIComponent(path).replace(/\.html$/, '').replace(/[\/_-]+/g, ' ').trim();
    if (!q) return;
    var best = G.items
      .filter(function (it) { return it.u.charAt(0) === '/'; })
      .map(function (it) { return { it: it, s: G.fuzzyScore(q, it.u + ' ' + it.t + ' ' + it.k) }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 3);
    if (!best.length) return;
    var box = document.getElementById('suggestions'), ul = box.querySelector('ul');
    best.forEach(function (x) {
      var li = document.createElement('li'), a = document.createElement('a');
      a.href = x.it.u; a.textContent = x.it.t;
      li.style.margin = '.4rem 0';
      li.appendChild(a); ul.appendChild(li);
    });
    box.hidden = false;
  })();
</script>
