<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sun Now</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#c8c8c8}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
        opacity:0;transition:opacity .6s;
        /* Pin the video to SDR. On an XDR panel WebKit otherwise hands it to the
           extended-dynamic-range pipeline and the colours come out wrong; an SDR
           monitor never enters that path, which is why only the MacBook's own
           screen showed it. */
        dynamic-range-limit:standard}
  video.on{opacity:1}

  #cap{position:fixed;left:2.2vw;bottom:2.2vh;line-height:1.5;text-shadow:0 1px 6px #000;
       opacity:0;transition:opacity 1.2s}
  #cap.on{opacity:.72}
  #cap b{display:block;font-size:1.6em;font-weight:500;color:#fff}
  #cap span{font-variant-numeric:tabular-nums}
  /* The funnel: a screen in a lobby has to say where to go. Only shown when the
     host app asks for it; a personal screen saver never does. */
  #attr{position:fixed;right:2.2vw;bottom:2.2vh;display:none;opacity:.55;
        letter-spacing:.04em;text-shadow:0 1px 6px #000;font-size:1.05em}
  /* WS-13: ?clock= puts the time at the top left. */
  #clock{position:fixed;left:2.2vw;top:2.2vh;display:none;color:#fff;opacity:.72;font-size:1.6em;
         font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000}
  /* SU-17: ?store=1 names the print shop on screen (text only: a wall has no pointer). */
  #store{position:fixed;right:2.2vw;bottom:calc(2.2vh + 2em);display:none;opacity:.72;
         letter-spacing:.04em;text-shadow:0 1px 6px #000;font-size:1.05em;color:#fff}
  /* SU-17: ?qr=1 adds a scannable code for the moment on screen above the text line. */
  #qr{position:fixed;right:2.2vw;bottom:calc(2.2vh + 4em);display:none;width:min(16vmin,200px);opacity:.92}
  #qr svg{display:block;width:100%;height:auto;border-radius:4px}
  /* WS-13: ?dome=1 turns the picture into a centred circle (the largest that fits) and moves
     the clock, caption and credit to the middle of the lower half, where a dome audience looks. */
  body.dome #stage{position:fixed;left:50%;top:50%;width:min(100vw,100vh);height:min(100vw,100vh);
                   transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
  body.dome video{object-fit:cover}
  body.dome #cap,body.dome #attr,body.dome #clock,body.dome #store{left:0;right:0;text-align:center}
  body.dome #clock{top:auto;bottom:calc(50% - min(50vw,50vh) + 14%)}
  body.dome #cap{bottom:calc(50% - min(50vw,50vh) + 6%)}
  body.dome #store{bottom:calc(50% - min(50vw,50vh) + 10%)}
  body.dome #qr{left:50%;right:auto;transform:translateX(-50%);bottom:calc(50% - min(50vw,50vh) + 20%)}
  body.dome #attr{bottom:calc(50% - min(50vw,50vh) + 1%);font-size:.9em}
</style>
</head>
<body>
<div id="stage"></div>
<div id="clock" aria-hidden="true"></div>
<div id="cap" aria-live="off"><b></b><span></span></div>
<div id="qr" aria-hidden="true"></div>
<div id="store"></div>
<div id="attr"></div>
<script>
const BUCKET = "https://the-sun-now.s3.us-east-2.amazonaws.com/";
const IDS = ["rainbow","171","193","211","304","335","94","131",
             "1600","1700","composite_uv","dem"];
const Q = new URLSearchParams(location.search);
// How many passes of each clip before moving on, and whether the order is
// shuffled. The host app injects these; a browser can pass ?loops=2&shuffle=1.
const LOOPS_PER_PRODUCT = Math.max(1, +(window.WALL_LOOPS ?? Q.get("loops") ?? 1));
const SHUFFLE = !!(window.WALL_SHUFFLE ?? (Q.get("shuffle") === "1"));
// WS-13: the display kit. Every option is off unless named, so a link without these
// behaves exactly as before; the /wall/ builder writes them for you.
//   clock=utc|local   a clock, top left
//   caption=0|stay    0 hides the channel label; stay keeps it on screen (default: six seconds a clip)
//   dome=1            a circular picture for a planetarium dome
//   attrib=0|1        0 hides the credit line; 1 shows it even outside the Mac app
//   ids=171,304       only these channels, in the order they are given
//   store=1           level 1 of "Print this Sun": a text line, myheliograph.com (no dependency)
//   qr=1              level 2: the text line plus a QR code for the moment on screen (store link with
//                     utm_source=wall, d, t, wl). Loads assets/vendor/qrcode-generator/qrcode.js; if
//                     that cannot load (the Mac app's cached copy), the text line stays alone.
//   qr=0              the default: no code (store=1 alone is the text line)
// wallOptions begin
function wallOptions(search) {
  const q = new URLSearchParams(search);
  const clock = q.get("clock");
  const caption = q.get("caption");
  const attrib = q.get("attrib");
  const ids = (q.get("ids") || "").split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
  return {
    clock: clock === "utc" || clock === "local" ? clock : null,
    caption: caption === "0" || caption === "stay" ? caption : "brief",
    dome: q.get("dome") === "1",
    store: q.get("store") === "1" || q.get("qr") === "1",
    qr: q.get("qr") === "1",
    attrib: attrib === "0" || attrib === "1" ? attrib : null,
    ids: ids.length ? ids : null,
  };
}
function wallClockText(date, mode) {
  const two = n => String(n).padStart(2, "0");
  if (mode === "local") return two(date.getHours()) + ":" + two(date.getMinutes());
  return two(date.getUTCHours()) + ":" + two(date.getUTCMinutes()) + " UTC";
}
function wallOrder(fresh, ids) {
  if (!ids) return fresh;
  const out = [];
  for (const id of ids) { const m = fresh.find(x => x.id === id); if (m && !out.includes(m)) out.push(m); }
  return out;
}
// The store link Heliogram's QR and sun.js storeLink also use: utm_source, d, t (UTC), wl for AIA ids.
function wallStoreLink(id, whenMs) {
  const two = n => String(n).padStart(2, "0");
  let q = "utm_source=wall";
  if (typeof whenMs === "number" && isFinite(whenMs)) {
    const t = new Date(whenMs);
    q += "&d=" + t.getUTCFullYear() + "-" + two(t.getUTCMonth() + 1) + "-" + two(t.getUTCDate()) +
         "&t=" + two(t.getUTCHours()) + ":" + two(t.getUTCMinutes());
    if (/^\d+$/.test(String(id))) q += "&wl=" + String(id);
  }
  return "https://myheliograph.com/?" + q;
}
// wallOptions end
const OPT = wallOptions(location.search);
const WALL_CREDIT = "Imagery courtesy of NASA/SDO and the AIA science team.";
const RATE = 0.5;                 // each 48 h clip is only 8 s at native 18 fps
const REFRESH_MS = 20 * 60 * 1000; // pipeline cadence

const stage = document.getElementById("stage"), cap = document.getElementById("cap");
// One <video> element per clip, never reused. The first play on an element is
// the one that renders right; on untagged H.264, WebKit's later render path
// after a src change makes a different colour guess and everything after the
// first clip comes out oversaturated. A fresh element each time keeps every
// clip on the first-play path, and a crossfade replaces the black gap.
let v = null;

function freshVideo(){
  const el = document.createElement("video");
  el.autoplay = true; el.muted = true; el.playsInline = true;
  el.addEventListener("ended", onEnded);
  el.addEventListener("error", onError);
  el.addEventListener("playing", () => {
    el.classList.add("on");
    for (const old of stage.querySelectorAll("video")) if (old !== el) {
      old.classList.remove("on");
      setTimeout(() => { old.pause(); old.removeAttribute("src"); old.load(); old.remove(); }, 700);
    }
  }, {once:true});
  stage.appendChild(el);
  return el;
}
if (OPT.dome) document.body.classList.add("dome");
// The host app's own line wins; ?attrib=1 adds the standard credit where there is none, and
// ?attrib=0 hides whichever it would have been.
{
  const text = window.WALL_ATTRIBUTION || (OPT.attrib === "1" ? WALL_CREDIT : "");
  if (text && OPT.attrib !== "0") {
    const a = document.getElementById("attr");
    a.textContent = text; a.style.display = "block";
  }
}
if (OPT.store) {
  const el = document.getElementById("store");
  el.textContent = "Print this Sun: myheliograph.com";
  el.style.display = "block";
}
// Level 2: load the vendored encoder once; draw() is called for each clip. No encoder, no code.
let drawQr = () => {};
if (OPT.qr) {
  const s = document.createElement("script");
  s.src = "/assets/vendor/qrcode-generator/qrcode.js";
  s.onload = () => {
    if (typeof qrcode !== "function") return;
    drawQr = (text) => {
      try {
        const q = qrcode(0, "M");
        q.addData(text); q.make();
        const box = document.getElementById("qr");
        box.innerHTML = q.createSvgTag({cellSize: 4, margin: 16, scalable: true});
        box.style.display = "block";
      } catch (e) { /* too long or encoder error: the text line stays */ }
    };
    if (items.length) drawQr(wallStoreLink(items[i % items.length].id, Date.parse(items[i % items.length].updated)));
  };
  document.head.appendChild(s);
}
if (OPT.clock) {
  const el = document.getElementById("clock");
  const tick = () => { el.textContent = wallClockText(new Date(), OPT.clock); };
  tick(); el.style.display = "block"; setInterval(tick, 15000);
}
// A screen that must not dim: ask for a wake lock now and again whenever the tab is shown
// (the browser drops it when the tab is hidden). Where it is unsupported, nothing happens.
let wakeLock = null;
async function keepAwake() {
  try {
    if (!navigator.wakeLock || document.visibilityState !== "visible") return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
keepAwake();
document.addEventListener("visibilitychange", keepAwake);
// F toggles full screen in a browser (the Mac app is already full screen).
document.addEventListener("keydown", e => {
  if (e.key !== "f" && e.key !== "F") return;
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
});
// One product per screen: injected by the wall app, or ?p= in a browser.
let PIN = window.WALL_PRODUCT || Q.get("p");
if (PIN === "all") PIN = null;   // a screen set to cycle through everything
let items = [], i = 0, loops = 0;

// loadSunIndex begin
async function loadSunIndex(bucket, now) {
  try {
    const r = await fetch(bucket + "manifest/index.json", {cache: "no-store"});
    if (!r.ok) return null;
    const idx = await r.json();
    if (!idx || typeof idx.generated !== "string" || !Array.isArray(idx.products)) return null;
    const t = Date.parse(idx.generated);
    // An index older than 6 hours (estimated limit) is ignored: the per-product manifests are read instead.
    if (isNaN(t) || (now === undefined ? Date.now() : now) - t > 6 * 3600 * 1000) return null;
    return {generated: idx.generated, products: idx.products.filter(p => p && typeof p.id === "string")};
  } catch (e) {
    return null;
  }
}
// loadSunIndex end

async function refresh(){
  // A local manifest.json means we are being served out of the wall app's cache:
  // play those files and never touch the network, which is what lets a kiosk
  // survive indefinitely without one. In a browser there is no such file, so
  // fall through to the bucket.
  const local = await fetch("manifest.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).catch(() => null);

  let fresh;
  if (local && local.length) {
    fresh = local.map(m => ({...m, base: ""}));
  } else {
    // One index request when the index is usable; otherwise, or for a product the index lacks, the
    // per-product manifests as before (~200 bytes each; this runs once every 20 min). Ordered results,
    // failures dropped rather than retried.
    const idx = await loadSunIndex(BUCKET);
    const byId = new Map(idx ? idx.products.map(p => [p.id, p]) : []);
    const got = await Promise.all(IDS.map(id => byId.has(id) ? byId.get(id) :
      fetch(BUCKET + "manifest/" + id + ".json", {cache:"no-store"})
        .then(r => r.ok ? r.json() : null).catch(() => null)));
    fresh = got.filter(Boolean).map(m => ({...m, base: BUCKET}));
  }

  let want = PIN ? fresh.filter(m => m.id === PIN) : wallOrder(fresh, OPT.ids);
  if (SHUFFLE) {                       // Fisher-Yates; a fresh order every refresh
    for (let k = want.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1)); [want[k], want[j]] = [want[j], want[k]];
    }
  }
  if (want.length) items = want;       // keep the old list if the network is down
}

function play(){
  if (!items.length) return;
  const m = items[i % items.length];
  const src = (m.base ?? BUCKET) + m.video + "?v=" + encodeURIComponent(m.updated);
  v = freshVideo();
  v.src = src;
  v.playbackRate = RATE;
  v.play().catch(()=>{});
  cap.querySelector("b").textContent = m.label;
  cap.querySelector("span").textContent =
    "48 h to " + new Date(m.updated).toLocaleString([], {
      month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  if (OPT.qr) drawQr(wallStoreLink(m.id, Date.parse(m.updated)));
  if (OPT.caption !== "0") cap.classList.add("on");
  if (OPT.caption === "brief") setTimeout(() => cap.classList.remove("on"), 6000);
}

function onEnded(){
  if (++loops >= LOOPS_PER_PRODUCT) { loops = 0; i++; }
  play();
}
// A dead or 404 video must not freeze the wall: step past it.
function onError(){ loops = 0; i++; setTimeout(play, 1000); }

(async () => { await refresh(); play(); })();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
